<div class="container">
  <div class="header-section">
    <h2>Library Book Directory</h2>
    <p>Manage, view, and organize all available books in the system.</p>
  </div>

  <div class="table-card">
    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Book Title</th>
          <th>Author Name</th>
          <th>Category</th>
          <th>Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books$ | async">
          <td><span class="badge">#{{ book.id }}</span></td>
          <td><strong>{{ book.title }}</strong></td>
          <td>{{ book.author }}</td>
          <td><span class="category-tag">{{ book.category }}</span></td>
          <td>{{book.createdAt | date:'short'}}</td>
          <td class="btns-group">
            <button class="update-btn" (click)="updateBook(book.id)">Update</button>
            <button class="delete-btn" (click)="deleteBook(book.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
